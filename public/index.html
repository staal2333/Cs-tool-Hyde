<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16284a">
  <title>Hyde Media — Outreach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login gate -->
  <div id="gate" class="gate" style="display:none">
    <form class="gatebox" id="loginForm">
      <h1>Hyde Media — Outreach</h1>
      <p>Indtast adgangskode for at fortsætte.</p>
      <input id="pw" type="password" placeholder="Adgangskode" autocomplete="current-password">
      <button class="hbtn" type="submit">Log ind</button>
      <div id="loginErr" class="loginerr"></div>
    </form>
  </div>

  <!-- App -->
  <div id="app" style="display:none">
    <header>
      <div class="wrap">
        <h1>Hyde Media — Outreach</h1>
        <p>Kopiér → indsæt i Gmail. Status gemmes nu i skyen og deles på tværs af dine enheder. Opfølgninger dukker op efter X dage.</p>
        <div class="hbtns">
          <button class="hbtn hbtn-sun" id="btnBrief">☀️ Dagens plan</button>
          <button class="hbtn hbtn-primary" id="btnAdd">➕ Tilføj kunde</button>
          <button class="hbtn" id="btnClassify">🏷️ Auto-tag indkøb</button>
          <button class="hbtn" id="btnExport">📥 Eksportér status (CSV)</button>
          <button class="hbtn" id="btnSummary">📋 Kopiér opsummering</button>
          <label>Opfølgning efter <input id="thr" type="number" value="5" min="1"> dage</label>
          <button class="hbtn" id="btnReset">↺ Nulstil</button>
          <button class="hbtn" id="btnLogout">Log ud</button>
          <span id="gmailbox" class="gmailbox"></span>
        </div>
        <div id="synctoast" class="synctoast" style="display:none"></div>
      </div>
    </header>

    <div class="wrap">
      <div class="tabs">
        <button class="tab active" data-tab="kold">🔵 Kolde <span class="tabcount" id="c-kold"></span></button>
        <button class="tab" data-tab="varm">🔥 Varme <span class="tabcount" id="c-varm"></span></button>
        <button class="tab" data-tab="opfolg">⏰ Opfølgning <span class="tabcount" id="c-opfolg"></span></button>
        <button class="tab" data-tab="svar">💬 Svar <span class="tabcount" id="c-svar"></span></button>
      </div>

      <div class="bar" id="bar"></div>

      <div class="controls">
        <input id="q" placeholder="Søg kunde, emne eller type…">
        <select id="fil">
          <option value="">Vis alle</option>
          <option value="Ikke kontaktet">Kun ikke-sendt</option>
          <option value="Sendt">Kun sendt</option>
          <option value="Opfølgning sendt">Kun opfulgt</option>
          <option value="Svar modtaget">Kun svar</option>
          <option value="Booket">Kun booket</option>
          <option value="Nej tak">Kun nej tak</option>
        </select>
        <select id="fbuyer">
          <option value="">Alt medieindkøb</option>
          <option value="bureau">🏢 Kun bureau</option>
          <option value="selv">🤝 Kun selv</option>
          <option value="ukendt">❓ Kun ukendt</option>
        </select>
      </div>

      <div id="list"></div>
      <div id="empty" class="empty" style="display:none"></div>
    </div>
  </div>

  <!-- Add / edit contact modal -->
  <div id="modal" class="modal" style="display:none">
    <div class="modalbox">
      <div class="modalhead"><span id="modalTitle">Tilføj kunde</span><button class="modalx" id="modalClose">✕</button></div>
      <div class="modalbody">
        <label class="fld"><span>Firma *</span><input id="f-company" placeholder="Fx Acme A/S"></label>
        <div class="fldrow">
          <label class="fld"><span>Temperatur</span>
            <select id="f-temp"><option value="kold">🔵 Kold</option><option value="varm">🔥 Varm</option></select></label>
          <label class="fld"><span>Medieindkøb</span>
            <select id="f-buyer"><option value="ukendt">❓ Ukendt</option><option value="bureau">🏢 Mediebureau</option><option value="selv">🤝 Selv (in-house)</option></select></label>
          <label class="fld"><span>Anbefalet placering</span>
            <select id="f-placement"></select></label>
        </div>
        <label class="fld"><span>Segment / type</span><input id="f-segment" placeholder="Fx Første kontakt"></label>
        <div class="fldrow">
          <label class="fld"><span>Kontaktperson</span><input id="f-person" placeholder="Fx Dorthe Hansen"></label>
          <label class="fld"><span>Email</span><input id="f-email" placeholder="navn@firma.dk"></label>
          <label class="fld"><span>Telefon</span><input id="f-phone" placeholder="+45 …"></label>
        </div>
        <label class="fld"><span>Emne (mailudkast)</span><input id="f-subject" placeholder="Emnelinje til mailen"></label>
        <label class="fld"><span>Besked (mailudkast)</span><textarea id="f-body" placeholder="Hej …"></textarea></label>
        <div id="modalErr" class="loginerr"></div>
      </div>
      <div class="modalfoot">
        <button class="btn small" id="modalCancel">Annullér</button>
        <button class="btn" id="modalSave">Gem</button>
      </div>
    </div>
  </div>

  <!-- Daily briefing overlay -->
  <div id="brief" class="modal" style="display:none">
    <div class="modalbox briefbox">
      <div class="modalhead"><span>☀️ Dagens plan</span>
        <div><button class="btn small" id="briefRefresh">↻ Opdatér</button>
        <button class="modalx" id="briefClose">✕</button></div>
      </div>
      <div class="modalbody" id="briefBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
